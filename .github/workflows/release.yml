name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:  # manual trigger

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14        # Apple Silicon (M1/M2/M3/M4)
            artifact_name: OurNook-macOS-arm64
            asset_name: OurNook-${{ github.ref_name }}-macOS-arm64
            spec: OurNook.spec
            torch_index: ""     # default macOS arm64 wheel — supports MPS
            venv_activate: ".venv/bin/activate"
          - os: macos-13        # Intel Macs
            artifact_name: OurNook-macOS-x64
            asset_name: OurNook-${{ github.ref_name }}-macOS-x64
            spec: OurNook.spec
            env_arch: x86_64
            torch_index: ""     # default macOS x86_64 wheel
            venv_activate: ".venv/bin/activate"
          - os: windows-latest
            artifact_name: OurNook-Windows-x64
            asset_name: OurNook-${{ github.ref_name }}-Windows-x64
            spec: OurNook-windows.spec
            torch_index: "--extra-index-url https://download.pytorch.org/whl/cpu"
            venv_activate: ".venv/Scripts/activate"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node (for frontend build)
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - name: Build frontend
        run: pnpm install --frozen-lockfile && pnpm build

      - name: Install Python deps
        shell: bash
        run: |
          python -m venv .venv
          source ${{ matrix.venv_activate }}
          # Use `python -m pip` so we always invoke the venv's pip, not a
          # system pip that might be on PATH first (Windows runner quirk).
          python -m pip install -U pip wheel
          python -m pip install pyinstaller
          # CPU-only torch on Windows (smaller, runner has no GPU anyway).
          # Mac gets the default wheel so MPS works at runtime.
          python -m pip install ${{ matrix.torch_index }} torch
          python -m pip install -r requirements.txt || true
          # Fallback: install the specific deps we know we need, including
          # the diffusers/transformers/safetensors stack for v0.15.2 real
          # diffusion image gen.
          python -m pip install fastapi 'uvicorn[standard]' httpx pydantic aiosqlite pywebview
          python -m pip install diffusers transformers accelerate safetensors Pillow

      - name: Build with PyInstaller
        shell: bash
        run: |
          ${{ matrix.venv_activate }}
          pyinstaller ${{ matrix.spec }} --noconfirm --clean

      - name: Package macOS .dmg
        if: matrix.os == 'macos-14' || matrix.os == 'macos-13'
        run: |
          mkdir -p dist/release-staging
          # Clean staging
          find dist/release-staging -mindepth 1 -delete 2>/dev/null || true
          mkdir -p dist/release-staging
          cp -R dist/OurNook.app dist/release-staging/
          ln -s /Applications dist/release-staging/Applications
          VOLNAME="OurNook ${{ github.ref_name }}"
          hdiutil create -volname "$VOLNAME" \
            -srcfolder dist/release-staging \
            -ov -format UDZO \
            dist/${{ matrix.asset_name }}.dmg
        shell: bash

      - name: Package Windows .zip
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          # Use 7-zip to make a smaller archive
          7z a -tzip -mx=9 "dist/${{ matrix.asset_name }}.zip" dist/OurNook

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            dist/${{ matrix.asset_name }}.dmg
            dist/${{ matrix.asset_name }}.zip
            dist/OurNook.app/**/*
            dist/OurNook/OurNook.exe
            dist/OurNook/_internal/**

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/${{ matrix.asset_name }}.dmg
            dist/${{ matrix.asset_name }}.zip
          fail_on_unmatched_files: false
