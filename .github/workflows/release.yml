name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:  # manual trigger

jobs:
  # macOS Apple Silicon (M1/M2/M3/M4) — pyinstaller OurNook.spec, hdiutil DMG
  build-macos-arm64:
    name: Build (macOS arm64)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build frontend
        run: pnpm install --frozen-lockfile && pnpm build

      - name: Set up venv + install deps
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -U pip wheel
          .venv/bin/python -m pip install pyinstaller
          .venv/bin/python -m pip install -r requirements.txt
          .venv/bin/python -m pip install diffusers transformers accelerate safetensors Pillow

      - name: Build with PyInstaller
        run: .venv/bin/python -m PyInstaller OurNook.spec --noconfirm --clean

      - name: Package DMG
        run: |
          mkdir -p dist/release-staging
          cp -R dist/OurNook.app dist/release-staging/
          ln -s /Applications dist/release-staging/Applications
          hdiutil create -volname "OurNook ${{ github.ref_name }}" \
            -srcfolder dist/release-staging \
            -ov -format UDZO \
            dist/OurNook-${{ github.ref_name }}-macOS-arm64.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: OurNook-macOS-arm64
          path: dist/OurNook-*.dmg

  # macOS Intel — pyinstaller OurNook.spec, hdiutil DMG
  build-macos-x64:
    name: Build (macOS x64)
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build frontend
        run: pnpm install --frozen-lockfile && pnpm build

      - name: Set up venv + install deps
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -U pip wheel
          .venv/bin/python -m pip install pyinstaller
          .venv/bin/python -m pip install -r requirements.txt
          .venv/bin/python -m pip install diffusers transformers accelerate safetensors Pillow

      - name: Build with PyInstaller
        run: .venv/bin/python -m PyInstaller OurNook.spec --noconfirm --clean

      - name: Package DMG
        run: |
          mkdir -p dist/release-staging
          cp -R dist/OurNook.app dist/release-staging/
          ln -s /Applications dist/release-staging/Applications
          hdiutil create -volname "OurNook ${{ github.ref_name }}" \
            -srcfolder dist/release-staging \
            -ov -format UDZO \
            dist/OurNook-${{ github.ref_name }}-macOS-x64.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: OurNook-macOS-x64
          path: dist/OurNook-*.dmg

  # Windows x64 — CPU-only torch, OurNook-windows.spec, 7z zip
  build-windows:
    name: Build (Windows x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build frontend
        run: pnpm install --frozen-lockfile && pnpm build

      - name: Set up venv + install deps
        shell: bash
        run: |
          python -m venv .venv
          .venv/Scripts/python.exe -m pip install -U pip wheel
          .venv/Scripts/python.exe -m pip install pyinstaller
          .venv/Scripts/python.exe -m pip install --extra-index-url https://download.pytorch.org/whl/cpu torch
          .venv/Scripts/python.exe -m pip install -r requirements.txt
          .venv/Scripts/python.exe -m pip install diffusers transformers accelerate safetensors Pillow

      - name: Build with PyInstaller
        shell: bash
        run: .venv/Scripts/python.exe -m PyInstaller OurNook-windows.spec --noconfirm --clean

      - name: Package zip
        shell: bash
        run: 7z a -tzip -mx=9 dist/OurNook-${{ github.ref_name }}-Windows-x64.zip dist/OurNook

      - uses: actions/upload-artifact@v4
        with:
          name: OurNook-Windows-x64
          path: dist/OurNook-*.zip

  attach-release:
    name: Attach artifacts to GitHub Release
    if: startsWith(github.ref, 'refs/tags/v') && always()
    needs: [build-macos-arm64, build-macos-x64, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/OurNook-macOS-arm64/OurNook-*.dmg
            artifacts/OurNook-macOS-x64/OurNook-*.dmg
            artifacts/OurNook-Windows-x64/OurNook-*.zip
          fail_on_unmatched_files: false
