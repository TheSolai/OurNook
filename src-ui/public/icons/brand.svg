<?xml version="1.0" encoding="UTF-8"?>
<!-- OurNook brand mark — a heart with two figures embracing, representing companionship.
     Used for the boot screen, sidebar brand, and window title. Aligned with
     the v0.7 "Dusk" palette: warm-neutral charcoal background, dusty rose heart. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2530"/>
      <stop offset="1" stop-color="#3a2d2e"/>
    </linearGradient>
    <linearGradient id="heart" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e6b8a0"/>
      <stop offset="1" stop-color="#d4978a"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="1.5"/></filter>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bg)"/>
  <!-- Glowing halo -->
  <path d="M32 50 C 12 38, 12 22, 22 18 C 27 16, 31 18, 32 22 C 33 18, 37 16, 42 18 C 52 22, 52 38, 32 50 Z"
        fill="url(#heart)" filter="url(#glow)" opacity="0.5"/>
  <!-- Two figures embracing inside the heart -->
  <path d="M32 50 C 12 38, 12 22, 22 18 C 27 16, 31 18, 32 22 C 33 18, 37 16, 42 18 C 52 22, 52 38, 32 50 Z"
        fill="url(#heart)"/>
  <!-- Heads of the two figures -->
  <circle cx="24" cy="28" r="3.5" fill="#ebebe9"/>
  <circle cx="40" cy="28" r="3.5" fill="#ebebe9"/>
  <!-- Arms embracing (the curl between them) -->
  <path d="M27 32 Q 32 35, 37 32" fill="none" stroke="#ebebe9" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Body curve (suggesting hug) -->
  <path d="M22 38 Q 32 46, 42 38" fill="none" stroke="#ebebe9" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/>
</svg>
