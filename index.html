<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OurNook</title>
    <link rel="icon" type="image/png" href="/icons/favicon.png" />
    <link rel="apple-touch-icon" href="/icons/icon-256.png" />
    <style>
      html, body { margin: 0; padding: 0; height: 100%; background: #0e0d10; color: #ebebe9; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; overflow: hidden; }
      #root { height: 100%; }
      .boot {
        position: fixed; inset: 0;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        gap: 16px;
        background: #0e0d10;
        color: #ebebe9;
        z-index: 9999;
        transition: opacity 400ms ease;
      }
      .boot-logo {
        font-size: 28px; font-weight: 700; letter-spacing: -0.02em;
        color: #ebebe9;
        display: flex; align-items: center; gap: 12px;
      }
      .boot-logo img { width: 36px; height: 36px; }
      .boot-tag {
        font-size: 12px; color: #6e6c6a; letter-spacing: 0.04em; text-transform: uppercase;
        margin-top: -8px;
      }
      .boot-dots {
        display: flex; gap: 6px; margin-top: 12px;
      }
      .boot-dot {
        width: 7px; height: 7px; border-radius: 50%;
        background: #d9a48a;
        opacity: 0.25;
        animation: bootpulse 1.2s ease-in-out infinite;
      }
      .boot-dot:nth-child(2) { animation-delay: 0.2s; }
      .boot-dot:nth-child(3) { animation-delay: 0.4s; }
      @keyframes bootpulse {
        0%, 100% { opacity: 0.25; transform: scale(0.85); }
        50% { opacity: 1; transform: scale(1); }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div class="boot" id="boot">
      <div class="boot-logo">
        <img src="/icons/brand.svg" alt="" />
        OurNook
      </div>
      <div class="boot-tag">Warming up</div>
      <div class="boot-dots"><div class="boot-dot"></div><div class="boot-dot"></div><div class="boot-dot"></div></div>
    </div>
    <script>
      // Remove the boot screen once React mounts
      window.addEventListener('DOMContentLoaded', () => {
        const obs = new MutationObserver(() => {
          if (document.getElementById('root')?.children.length > 0) {
            const b = document.getElementById('boot');
            if (b) { b.style.opacity = '0'; setTimeout(() => b.remove(), 400); }
            obs.disconnect();
          }
        });
        obs.observe(document.getElementById('root'), { childList: true });
        // Failsafe: remove after 5s regardless
        setTimeout(() => {
          const b = document.getElementById('boot');
          if (b) { b.style.opacity = '0'; setTimeout(() => b.remove(), 400); }
        }, 5000);
      });
    </script>
    <script type="module" src="/src-ui/main.tsx"></script>
  </body>
</html>
