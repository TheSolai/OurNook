[workspace]
resolver = "2"
members = [
    "nook-core",
    "nook-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
authors = ["Anne Marie Lee"]
repository = "https://github.com/TheSolAI/nook"

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
